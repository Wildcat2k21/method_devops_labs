# ЛР 7: сборка Docker-образа сервиса «Аптека» и публикация в Docker Hub.
name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/pharmacy-service

jobs:
  image:
    name: Build & Push image
    runs-on: ubuntu-latest
    # Публикуем только при push (не в PR) и если секреты Docker Hub заданы:
    # без них образ лишь собирается, а workflow не падает на логине.
    env:
      PUSH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    outputs:
      tag: ${{ steps.meta.outputs.version }}
      pushed: ${{ env.PUSH }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: lb6/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test pushed image
    needs: image
    if: needs.image.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run
        run: |
          docker run -d --name pharmacy -p 8080:8080 -p 9090:9090 "$IMAGE:${{ needs.image.outputs.tag }}"
          for _ in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 0.5; done

      - name: curl endpoints
        run: |
          ID=$(curl -fsS -X POST localhost:8080/medicines -H 'Content-Type: application/json' \
            -d '{"name":"Аспирин","manufacturer":"Bayer","price":120,"quantity":10}' | jq -r .id)
          curl -fsS -X POST "localhost:8080/medicines/$ID/sell" -H 'Content-Type: application/json' -d '{"count":4}'
          curl -fsS "localhost:8080/medicines/$ID" | tee medicine.json
          test "$(jq .quantity medicine.json)" = 6

      - name: Container logs
        if: always()
        run: docker logs pharmacy

  notify:
    name: Notify
    needs: [image, smoke]
    if: always()
    uses: ./.github/workflows/notify.yml
    with:
      workflow: Docker
      status: >-
        ${{ contains(needs.*.result, 'failure') && 'failure'
         || contains(needs.*.result, 'cancelled') && 'cancelled'
         || 'success' }}
    secrets: inherit
